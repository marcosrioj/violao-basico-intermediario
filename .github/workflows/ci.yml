name: Verificação
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - name: Keep local Supabase configuration out of deployments
        run: |
          if git ls-files --error-unmatch supabase/config.toml >/dev/null 2>&1; then
            echo "::error::supabase/config.toml is local only. Use config.local.toml.example and manage production Auth URLs in the Supabase dashboard."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:http:ci
